<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --gutter-bg: #282c34;
}
.cm-gutters {
    display: flex;
    background-color: var(--gutter-bg);
    color: #6e7781;
}
.cm-lineNumbers {
    min-width: 22px;
    text-align: right;
}
.cm-foldGutter {
    width: 0px;
}
.cm-foldGutter .cm-gutterElement {
    position: relative;
    left: -22px;
    width: 22px;
    text-align: center;
}
.cm-foldMarker {
    display: block;
    width: 100%;
    height: 100%;
    background-color: var(--gutter-bg);
    cursor: pointer;
}
</style>
</head>
<body>
<div class="cm-gutters">
    <div class="cm-gutter cm-lineNumbers">
        <div class="cm-gutterElement">1</div>
        <div class="cm-gutterElement">2</div>
    </div>
    <div class="cm-gutter cm-foldGutter">
        <div class="cm-gutterElement" style="height: 18px;"></div>
        <div class="cm-gutterElement"><span class="cm-foldMarker" style="color: white">▾</span></div>
    </div>
</div>
</body>
</html>
